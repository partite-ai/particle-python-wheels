# Shared cross-toolchain bootstrap for the wheel builds.
# Mirrors what .devcontainer/Dockerfile installs so a green CI run
# implies the local dev container also works.
#
# Installs:
#   - WASI SDK 33 to /opt/wasi-sdk (matches dev container's pin)
#   - Rust stable with the wasm32-wasip2 target
#   - uv (Astral's Python manager — cryptography's Makefile uses it to
#     provision a host CPython 3.14 venv with cffi + setuptools)
#
# Caches:
#   - /opt/wasi-sdk        keyed on WASI_SDK_VERSION
#   - ~/.cargo, ~/.rustup  default Rust cache
#   - ~/.cache/particle    tarballs + cpython/aws-lc build trees
#   - ~/cargo-target       cpython cross-build output (shared with
#                          repo root's `make python-lib` convention)

name: setup-wasi-toolchain
description: Install wasi-sdk + Rust wasm32-wasip2 + uv

runs:
  using: composite
  steps:
    - name: cache wasi-sdk
      id: cache-wasi-sdk
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: /opt/wasi-sdk
        key: wasi-sdk-33-${{ runner.os }}-${{ runner.arch }}

    - name: install wasi-sdk
      if: steps.cache-wasi-sdk.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        # sha256 of each per-arch tarball, pinned to defend against a
        # re-pushed release replacing the binary under the same tag.
        # Refresh on version bump via the release's asset metadata:
        #   curl -fsSL https://api.github.com/repos/WebAssembly/wasi-sdk/releases/tags/wasi-sdk-33 \
        #     | jq -r '.assets[] | select(.name|endswith("-linux.tar.gz")) | "\(.name) \(.digest)"'
        case "$(uname -m)" in
          x86_64)  arch=x86_64; sha256=0ba8b5bfaeb2adf3f29bab5841d76cf5318ab8e1642ea195f88baba1abd47bce ;;
          aarch64) arch=arm64;  sha256=4f98ee738c7abb45c81a94d1461fc53cc569d1cd01498951c8184d841a027844 ;;
          *) echo "unsupported arch $(uname -m)"; exit 1 ;;
        esac
        curl -fsSL -o /tmp/wasi-sdk.tar.gz \
          "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-${arch}-linux.tar.gz"
        echo "${sha256}  /tmp/wasi-sdk.tar.gz" | sha256sum -c -
        sudo mkdir -p /opt
        sudo tar -xzf /tmp/wasi-sdk.tar.gz -C /opt
        sudo mv "/opt/wasi-sdk-33.0-${arch}-linux" /opt/wasi-sdk
        rm /tmp/wasi-sdk.tar.gz

    - name: export WASI_SDK_PATH
      shell: bash
      run: echo "WASI_SDK_PATH=/opt/wasi-sdk" >> "$GITHUB_ENV"

    - name: install rust + wasm32-wasip2
      # SHA-pinned per supply-chain hardening (refresh by re-resolving
      # the `stable` branch HEAD).
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      with:
        targets: wasm32-wasip2

    - name: cache cargo registries
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: cargo-${{ runner.os }}-${{ hashFiles('cryptography/Makefile') }}

    - name: install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
      with:
        # Pre-warm the 3.14 interpreter cryptography's host venv needs.
        python-version: "3.14"

    # Persistent caches for the heavy sub-builds. Keys are pinned to the
    # versions/refs hard-coded in the child Makefiles so a Makefile bump
    # invalidates the relevant cache. Misses just mean a slow first run.
    - name: cache cpython build tree
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: |
          ~/.cache/particle/cpython-build
          ~/cargo-target/cpython-0e13686da8bb881b059d35e23c32bcd2e6440099
        key: cpython-0e13686da-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cpython/Makefile') }}

    # PIC + exceptions C++ runtime (libc++/libc++abi/libunwind) that the duckdb
    # wheel static-links — wasi-sdk ships no PIC+eh variant, so duckdb-python's
    # Makefile builds it from LLVM source via cxx-eh-pic-runtime/build.sh (~15min
    # + an LLVM clone). Cache the install so only build.sh changes (the recipe)
    # or a wasi-sdk bump (the literal `33-` below) force a rebuild. The Makefile
    # rule treats it as built when libc++abi.a is present, so a hit skips it.
    - name: cache PIC+exceptions C++ runtime
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: ~/cxx-eh-pic-install
        key: cxx-eh-pic-33-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cxx-eh-pic-runtime/build.sh') }}

    - name: refresh cxx-eh-pic mtimes
      # On a cache hit the restored .a files predate the fresh checkout's
      # build.sh; touch them so make doesn't re-trigger the 15-min build.
      shell: bash
      run: touch -c ~/cxx-eh-pic-install/lib/*.a 2>/dev/null || true

    # libffi-wasi writes its outputs in-tree (libffi-wasi/out/ +
    # libffi-wasi/build/). Without caching them, cffi's downstream
    # _cffi_backend.so relinks every run because LIBFFI_LIB gets a
    # fresh mtime each time we rebuild the static archive.
    - name: cache libffi-wasi build outputs
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: |
          libffi-wasi/out
          libffi-wasi/build
        key: libffi-wasi-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('libffi-wasi/Makefile', 'libffi-wasi/src/*', 'libffi-wasi/include/*', 'libffi-wasi/patches/*') }}

    # Cache the full cryptography build tree. The cargo target dir
    # inside (build/src/cryptography-*/src/rust/target) is explicitly
    # wiped in the post-restore step below — restoring it caused
    # cargo's bindgen-cli wrapper recipe to corrupt itself on cached
    # runs, surfacing as a "Compiling cryptography-keepalive" hang.
    - name: cache cryptography build tree
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: ~/.cache/particle/wheels-cryptography
        key: cryptography-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cryptography/Makefile', 'cryptography/patches-aws-lc/*', 'cryptography/patches-cryptography/*') }}

    - name: cache cffi build tree
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: ~/.cache/particle/wheels-cffi
        key: cffi-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cffi/Makefile', 'cffi/patches-cffi/*') }}

    # Cache the full pydantic-core build tree. Cargo target dir is
    # wiped post-restore (see step below), same rationale as
    # cryptography.
    - name: cache pydantic-core build tree
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: ~/.cache/particle/wheels-pydantic-core
        key: pydantic-core-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pydantic-core/Makefile') }}

    # After all caches restore: wipe the cargo target dirs that lived
    # inside the wheel build trees. Cargo target dirs don't round-trip
    # cleanly through tar (mtime, .cargo-lock, fingerprint state), and
    # the failure mode is silent — cargo schedules work against
    # half-valid intermediates and either rebuilds noisily or hangs.
    # Re-running cargo from scratch against the cached ~/.cargo
    # registry takes ~3 min for cryptography, ~1 min for pydantic-core.
    - name: wipe stale cargo target dirs from restored caches
      shell: bash
      run: |
        set -eux
        rm -rf ~/.cache/particle/wheels-cryptography/build/src/cryptography-*/src/rust/target || true
        rm -rf ~/.cache/particle/wheels-pydantic-core/build/src/pydantic_core-*/target || true

    - name: cache regex build tree
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: ~/.cache/particle/wheels-regex
        key: regex-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('regex/Makefile') }}

    - name: cache pyyaml build tree
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: ~/.cache/particle/wheels-pyyaml
        key: pyyaml-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyyaml/Makefile') }}
